<form method="POST">
    {% csrf_token %}
    <label for="system_message">System Message:</label><br>
    <input type="text" id="system_message" name="system_message" placeholder="Enter system message" required><br>
    
    <label for="user_input">User Input:</label><br>
    <textarea id="user_input" name="user_input" placeholder="Enter your prompt" required></textarea><br>
    
    <input type="submit" value="Generate">
</form>

{% if generated_summary %}
    <h2>Generated Summary:</h2>
    <p>{{ generated_summary }}</p>
{% endif %}

{% if error %}
    <h2>Error:</h2>
    <p>{{ error }}</p>
{% endif %}
