<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporter Page</title>
    <style>
        /* CSS for styling */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        h1 {
            color: #007acc;
        }
        h2 {
            color: #005a99;
        }
        p {
            line-height: 1.6;
        }
        .error {
            color: red;
        }
        form {
            margin-top: 20px;
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
        }
        textarea {
            width: 100%;
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            background-color: #007acc;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }
        button:hover {
            background-color: #005a99;
        }
        .link {
            margin-top: 20px;
            color: #007acc;
            text-decoration: none;
        }
        .link:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <h1>Reporter Page</h1>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    {% if story %}
        <h2>Generated News Story:</h2>
        <p>{{ story }}</p>
    {% else %}
        <p>No story found.</p>
    {% endif %}

    <form method="POST" action="">
        {% csrf_token %}
        <label for="query">For the demo, the model is set to find political news since this is a huge thing right now:</label><br>
        <textarea id="query" name="query" rows="4" cols="50" placeholder="Enter a prompt for your news story..."></textarea><br><br>
        <button type="submit" onclick="showLoading()">Generate News Story</button>
    </form>

    <a href="{% url 'director' %}" class="link">Check out the director to make the script</a><br>
    <a href="/" class="link">Back to Home</a>

    <!-- JavaScript for adding a simple loading message -->
    <script>
        function showLoading() {
            const loadingMessage = document.createElement("p");
            loadingMessage.textContent = "Generating your story, please wait...";
            loadingMessage.style.color = "green";
            document.body.appendChild(loadingMessage);
        }
    </script>
</body>
</html>
