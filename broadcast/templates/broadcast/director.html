{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Director Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f4f4f4;
        }
        h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 30px;
        }
        h2 {
            color: #2980b9;
            margin-top: 20px;
        }
        #script, #reporter-response {
            background-color: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        button {
            display: block;
            width: 100%;
            padding: 10px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
            margin-bottom: 20px;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #2980b9;
        }
        .navigation {
            margin-top: 20px;
            text-align: center;
        }
        .navigation a {
            display: inline-block;
            margin: 0 10px;
            padding: 10px 15px;
            background-color: #2ecc71;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        .navigation a:hover {
            background-color: #27ae60;
        }
    </style>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
</head>
<body>
    <h1>Director Page</h1>

    <div id="reporter-response">
        <h2>News Story:</h2>
        <p>{{ reporter_response }}</p>
    </div>

    <div id="script">
        <h2>Teleprompter Script:</h2>
        <p>{{ teleprompter_script }}</p>
    </div>

    <!-- Add CSRF token -->
    <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">

    <button id="generate-script">Generate Teleprompter Script</button>

    <div class="navigation">
        <a href="{% url 'reporter' %}">Back to Reporter</a>
        <a href="{% url 'anchorman' %}">Go to Anchorman</a>
        <a href="/">Back to Home</a>
    </div>

    <script>
        function getCSRFToken() {
            return document.querySelector('input[name="csrfmiddlewaretoken"]').value;
        }

        $(document).ready(function() {
            $('#generate-script').click(function() {
                const $button = $(this);
                $button.prop('disabled', true).text('Generating...');
                
                $.ajax({
                    url: "{% url 'director' %}",
                    method: "POST",
                    headers: { 
                        "X-Requested-With": "XMLHttpRequest", 
                        "X-CSRFToken": getCSRFToken()
                    },
                    data: JSON.stringify({ "action": "generate_script" }),
                    contentType: "application/json",
                    success: function(response) {
                        $('#script p').text(response.teleprompter_script);
                        $button.prop('disabled', false).text('Generate Teleprompter Script');
                    },
                    error: function(xhr) {
                        alert('Error: ' + xhr.responseJSON.error);
                        $button.prop('disabled', false).text('Generate Teleprompter Script');
                    }
                });
            });
        });
    </script>
</body>
</html>
