<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Director Page</title>
    <style>
        /* CSS for styling */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        h1 {
            color: #007acc;
        }
        h2 {
            color: #005a99;
        }
        p {
            line-height: 1.6;
            width: 100%;
            max-width: 600px;
        }
        button {
            background-color: #007acc;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }
        button:hover {
            background-color: #005a99;
        }
        .link {
            margin-top: 20px;
            color: #007acc;
            text-decoration: none;
        }
        .link:hover {
            text-decoration: underline;
        }
    </style>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
</head>
<body>
    <h1>Director Page</h1>

    <h2>News Story:</h2>
    <p>{{ reporter_response }}</p>

    <h2>Teleprompter Script:</h2>
    <p id="script">{{ teleprompter_script }}</p>

    <!-- CSRF Token for AJAX -->
    <input type="hidden" name="csrfmiddlewaretoken" value="{{ csrf_token }}">

    <button id="generate-script" onclick="showLoading()">Generate Teleprompter Script</button>

    <!-- JavaScript for AJAX request and loading message -->
    <script>
        function getCSRFToken() {
            return document.querySelector('input[name="csrfmiddlewaretoken"]').value;
        }

        function showLoading() {
            // Display a loading message while script is generating
            const loadingMessage = document.createElement("p");
            loadingMessage.textContent = "Generating teleprompter script, please wait...";
            loadingMessage.style.color = "green";
            loadingMessage.setAttribute("id", "loadingMessage");
            document.body.appendChild(loadingMessage);
        }

        $(document).ready(function() {
            $('#generate-script').click(function() {
                $.ajax({
                    url: "{% url 'director' %}",  // Replace with actual URL pattern name if different
                    method: "POST",
                    headers: { 
                        "X-Requested-With": "XMLHttpRequest", 
                        "X-CSRFToken": getCSRFToken()
                    },
                    data: JSON.stringify({ "action": "generate_script" }),
                    contentType: "application/json",
                    success: function(response) {
                        $('#script').text(response.teleprompter_script);
                        $('#loadingMessage').remove();  // Remove loading message
                    },
                    error: function(xhr) {
                        alert('Error: ' + xhr.responseJSON.error);
                        $('#loadingMessage').remove();  // Remove loading message if error
                    }
                });
            });
        });
    </script>

    <a href="{% url 'reporter' %}" class="link">Back to Reporter Page</a>
    <a href="{% url 'anchorman' %}" class="link">Have the Anchorman deliver the script</a>
</body>
</html>
