{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anchorman Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f4f4f4;
        }
        h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 30px;
        }
        h2 {
            color: #2980b9;
            margin-top: 20px;
        }
        #script-container, #audio-container {
            background-color: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        button {
            display: block;
            width: 100%;
            padding: 10px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
            margin-bottom: 20px;
            transition: background-color 0.3s;
        }
        button:hover {
            background-color: #2980b9;
        }
        audio {
            width: 100%;
            margin: 10px 0;
        }
        .navigation {
            margin-top: 20px;
            text-align: center;
        }
        .navigation a {
            display: inline-block;
            margin: 0 10px;
            padding: 10px 15px;
            background-color: #2ecc71;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        .navigation a:hover {
            background-color: #27ae60;
        }
        .teleprompter-container {
            width: 80%;
            height: 500px;
            background-color: #000;
            margin: 20px auto;
            position: relative;
            overflow: hidden;
            border-radius: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.3);
        }
        .script-content {
            color: #fff;
            font-size: 24px;
            line-height: 1.6;
            padding: 20px;
            text-align: center;
            position: absolute;
            width: 100%;
            box-sizing: border-box;
            transform: translateY(100%);
        }
        .controls {
            margin: 20px 0;
            display: flex;
            gap: 20px;
            align-items: center;
        }
        .button {
            padding: 10px 20px;
            font-size: 16px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        .button:hover {
            background-color: #2980b9;
        }
        .speed-control {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        #speed {
            width: 100px;
        }
        .marker {
            position: absolute;
            left: 0;
            width: 100%;
            height: 2px;
            background-color: rgba(255, 0, 0, 0.5);
            z-index: 2;
        }
        .top-marker {
            top: 45%;
        }
        .bottom-marker {
            top: 55%;
        }
    </style>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
</head>
<body>
    <h1>Anchorman Page</h1>

    <div class="teleprompter-container">
        <div class="marker top-marker"></div>
        <div class="marker bottom-marker"></div>
        <div class="script-content">
            {{ script|safe }}
        </div>
    </div>

    <div class="controls">
        <button class="button" id="start">Start</button>
        <button class="button" id="pause">Pause</button>
        <button class="button" id="reset">Reset</button>
        <div class="speed-control">
            <label for="speed">Speed:</label>
            <input type="range" id="speed" min="4" max="8" value="7" step="1">
            <span id="speed-value">7</span>
        </div>
    </div>

    <div id="audio-container">
        <h2>Generated MP3:</h2>
        <audio id="audio-player" controls>
            <source id="audio-source" src="{{ mp3_url }}" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>
    </div>

    <button id="generate-mp3">Generate MP3</button>

    <div class="navigation">
        <a href="{% url 'director' %}">Back to Director</a>
        <a href="{% url 'reporter' %}">Go to Reporter</a>
        <a href="/">Back to Home</a>
    </div>

    <script>
        const scriptContent = document.querySelector('.script-content');
        const startBtn = document.getElementById('start');
        const pauseBtn = document.getElementById('pause');
        const resetBtn = document.getElementById('reset');
        const speedControl = document.getElementById('speed');
        const speedValue = document.getElementById('speed-value');
        
        let isScrolling = false;
        let scrollInterval;
        let currentPosition = 30;

        function updateSpeed() {
            speedValue.textContent = speedControl.value;
        }

        function startScrolling() {
            if (!isScrolling) {
                isScrolling = true;
                scrollInterval = setInterval(() => {
                    currentPosition -= (speedControl.value * 0.02);
                    scriptContent.style.transform = `translateY(${currentPosition}%)`;
                    
                    // Stop when the script has scrolled completely
                    if (currentPosition < -100) {
                        clearInterval(scrollInterval);
                        isScrolling = false;
                    }
                }, 100);
            }
        }

        function pauseScrolling() {
            clearInterval(scrollInterval);
            isScrolling = false;
        }

        function resetScrolling() {
            clearInterval(scrollInterval);
            isScrolling = false;
            currentPosition = 30;
            scriptContent.style.transform = `translateY(${currentPosition}%)`;
        }

        startBtn.addEventListener('click', startScrolling);
        pauseBtn.addEventListener('click', pauseScrolling);
        resetBtn.addEventListener('click', resetScrolling);
        speedControl.addEventListener('input', updateSpeed);

        // Initialize speed value display
        updateSpeed();
    </script>

    <script>
        $(document).ready(function() {
            $('#generate-mp3').click(function() {
                const $button = $(this);
                $button.prop('disabled', true).text('Generating...');
                
                $.ajax({
                    url: "{% url 'anchorman' %}",
                    method: "POST",
                    headers: { "X-Requested-With": "XMLHttpRequest" },
                    data: JSON.stringify({ "action": "generate_mp3" }),
                    contentType: "application/json",
                    success: function(response) {
                        $('#audio-source').attr('src', response.mp3_url);
                        $('#audio-player')[0].load();
                        $button.prop('disabled', false).text('Generate MP3');
                    },
                    error: function(xhr) {
                        alert('Error: ' + xhr.responseJSON.error);
                        $button.prop('disabled', false).text('Generate MP3');
                    }
                });
            });
        });
    </script>
</body>
</html>
