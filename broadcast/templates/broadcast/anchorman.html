<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anchorman Page</title>
    <style>
        /* CSS for styling */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
        }
        h1 {
            color: #007acc;
        }
        h2 {
            color: #005a99;
        }
        #teleprompter-box {
            width: 100%;
            max-width: 600px;
            height: 200px;
            overflow: hidden;
            border: 2px solid #007acc;
            padding: 10px;
            margin-bottom: 20px;
            font-size: 1.1em;
            line-height: 1.6;
            text-align: center;
            position: relative;
        }
        #script {
            font-size: 2em;  /* Increase font size */
            position: relative;
            transition: transform 0.1s linear;
        }
        audio {
            margin-top: 20px;
        }
        button {
            background-color: #007acc;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            margin-top: 10px;
        }
        button:hover {
            background-color: #005a99;
        }
        .link {
            margin-top: 20px;
            color: #007acc;
            text-decoration: none;
        }
        .link:hover {
            text-decoration: underline;
        }
    </style>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
</head>
<body>
    <h1>Anchorman Page</h1>

    <h2>Teleprompter Script:</h2>
    <div id="teleprompter-box">
        <p id="script">{{ script }}</p>
    </div>

    <h2>Generated MP3:</h2>
    <audio id="audio-player" controls>
        <source id="audio-source" src="{{ mp3_url }}" type="audio/mpeg">
        Your browser does not support the audio element.
    </audio>

    <!-- Button to initiate MP3 generation -->
    <button id="generate-mp3" onclick="showLoading()">Generate MP3</button>

    <!-- JavaScript for AJAX request and loading message -->
    <script>
        function showLoading() {
            const loadingMessage = document.createElement("p");
            loadingMessage.textContent = "Generating MP3, please wait...";
            loadingMessage.style.color = "green";
            loadingMessage.setAttribute("id", "loadingMessage");
            document.body.appendChild(loadingMessage);
        }

        $(document).ready(function() {
            $('#generate-mp3').click(function() {
                $.ajax({
                    url: "{% url 'anchorman' %}",
                    method: "POST",
                    headers: { "X-Requested-With": "XMLHttpRequest" },
                    data: JSON.stringify({ "action": "generate_mp3" }),
                    contentType: "application/json",
                    success: function(response) {
                        $('#audio-source').attr('src', response.mp3_url);
                        $('#audio-player')[0].load();
                        $('#loadingMessage').remove();
                    },
                    error: function(xhr) {
                        alert('Error: ' + xhr.responseJSON.error);
                        $('#loadingMessage').remove();
                    }
                });
            });

            // Teleprompter scroll logic
            const audioPlayer = document.getElementById('audio-player');
            const scriptElement = document.getElementById('script');
            const teleprompterBox = document.getElementById('teleprompter-box');

            // Define the speed multiplier here; adjust as needed for faster/slower scroll
            const speedMultiplier = 1.5;

            audioPlayer.addEventListener('timeupdate', function() {
                const totalHeight = scriptElement.scrollHeight;
                const currentTime = audioPlayer.currentTime;
                const duration = audioPlayer.duration;

                // Calculate scroll position with speed multiplier for faster scrolling
                const scrollPosition = (totalHeight - teleprompterBox.clientHeight) * (currentTime / duration) * speedMultiplier;

                // Apply transform for scrolling effect
                scriptElement.style.transform = `translateY(-${scrollPosition}px)`;
            });
        });
    </script>

    <a href="/" class="link">Go to Home</a>
</body>
</html>
