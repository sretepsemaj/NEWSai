<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Articles List</title>
</head>
<body>
    <h1>Articles</h1>
    <ul>
        {% for article in articles %}
            <li>
                <strong>{{ article.title }}</strong><br>
                Source: {{ article.source }}<br>
                Published At: {{ article.published_at }}<br>
                <p>{{ article.content }}</p>
                <a href="{{ article.url }}">{{ article.url }}</a>  <!-- Link with URL displayed as text -->
            </li>
        {% endfor %}
    </ul>
</body>
</html>
