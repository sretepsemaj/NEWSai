{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Broadcast Home</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            color: #333;
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f4f4f4;
        }
        h1 {
            color: #2c3e50;
            text-align: center;
            margin-bottom: 30px;
        }
        .nav-container {
            background-color: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .nav-links {
            display: flex;
            justify-content: space-around;
            margin-top: 20px;
        }
        .nav-links a {
            display: inline-block;
            padding: 10px 20px;
            background-color: #3498db;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        .nav-links a:hover {
            background-color: #2980b9;
        }
        .nav-links a.reporter {
            background-color: #2ecc71;
        }
        .nav-links a.reporter:hover {
            background-color: #27ae60;
        }
        .nav-links a.director {
            background-color: #e74c3c;
        }
        .nav-links a.director:hover {
            background-color: #c0392b;
        }
        .nav-links a.anchorman {
            background-color: #f39c12;
        }
        .nav-links a.anchorman:hover {
            background-color: #d35400;
        }
    </style>
</head>
<body>
    <h1>Welcome to the Broadcast Page</h1>
    
    <div class="nav-container">
        <div class="nav-links">
            <a href="{% url 'reporter' %}" class="reporter">Reporter</a>
            <a href="{% url 'director' %}" class="director">Director</a>
            <a href="{% url 'anchorman' %}" class="anchorman">Anchorman</a>
        </div>
    </div>
</body>
</html>
